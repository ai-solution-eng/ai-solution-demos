apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-finetune.mergeExportScriptConfigMapName" . }}
  labels:
    {{- include "agentic-finetune.labels" . | nindent 4 }}
data:
  # The merge-export Job mounts this at /etc/merge-export/. Same pattern as
  # the custom-eval script — keeps the chart shipping over stock LF image
  # without needing a rebuild for script changes.
  run_merge_export.py: |
{{ .Files.Get "data/merge-export-script/run_merge_export.py" | indent 4 }}
