apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-finetune-v2.batchInferenceAdapterTemplateConfigMapName" . }}
  labels:
    {{- include "agentic-finetune-v2.labels" . | nindent 4 }}
data:
  # Adapter-source batch inference Job template. Same structural pattern as
  # custom-eval — LF image, GPU, workspace mount. Container command runs
  # our batched-decoding script from the script ConfigMap.

  batch-inference-adapter-job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: $((JOB_NAME))
      labels:
        {{- include "agentic-finetune-v2.labels" . | nindent 8 }}
        agentic-finetune-v2/component: batch-inference-adapter
        agentic-finetune-v2/run-id: "$((RUN_ID))"
    spec:
      ttlSecondsAfterFinished: {{ .Values.trainingJob.ttlSecondsAfterFinished }}
      backoffLimit: 0
      # Model load ~60s + 100 prompts @ ~1s each with concurrency 4 = ~30s,
      # so typical run is ~2 min. Cap at 30 min for safety.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "agentic-finetune-v2.selectorLabels" . | nindent 12 }}
            agentic-finetune-v2/component: batch-inference-adapter
            agentic-finetune-v2/run-id: "$((RUN_ID))"
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "agentic-finetune-v2.serviceAccountName" . }}
          {{- with .Values.trainingJob.gpu.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.trainingJob.gpu.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: batch-inference-adapter
              image: "{{ include "agentic-finetune-v2.image.llamaFactory" . }}"
              imagePullPolicy: {{ .Values.images.llamaFactory.pullPolicy }}
              command:
                - python3
                - /etc/batch-inference-adapter/run_batch_inference_adapter.py
                - $((CONFIG_PATH))
              env:
                - name: HF_HOME
                  value: /workspace/.cache/huggingface
                - name: TRANSFORMERS_CACHE
                  value: /workspace/.cache/huggingface/hub
                {{- with .Values.trainingJob.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                requests:
                  cpu: {{ .Values.trainingJob.resources.cpu.request | quote }}
                  memory: {{ .Values.trainingJob.resources.memory.request | quote }}
                  {{ .Values.trainingJob.gpu.resourceName }}: {{ .Values.trainingJob.gpu.count }}
                limits:
                  cpu: {{ .Values.trainingJob.resources.cpu.limit | quote }}
                  memory: {{ .Values.trainingJob.resources.memory.limit | quote }}
                  {{ .Values.trainingJob.gpu.resourceName }}: {{ .Values.trainingJob.gpu.count }}
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: batch-inference-adapter-script
                  mountPath: /etc/batch-inference-adapter
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: {{ include "agentic-finetune-v2.workspacePvcName" . }}
            - name: batch-inference-adapter-script
              configMap:
                name: {{ include "agentic-finetune-v2.batchInferenceAdapterScriptConfigMapName" . }}
                defaultMode: 0755
