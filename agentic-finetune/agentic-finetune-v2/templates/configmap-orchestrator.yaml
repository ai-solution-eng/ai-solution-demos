apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-finetune-v2.fullname" . }}-config
  labels:
    {{- include "agentic-finetune-v2.labels" . | nindent 4 }}
data:
  # Runtime configuration the orchestrator loads at startup.
  config.yaml: |
    workspace_dir: /workspace
    job_template_path: /etc/agentic-finetune-v2/job-template.yaml
    lf_config_template_path: /etc/agentic-finetune-v2/lf-config-template.yaml
    custom_eval_job_template_path: /etc/agentic-finetune-v2/custom-eval-job-template.yaml
    merge_export_job_template_path: /etc/agentic-finetune-v2/merge-export-job-template.yaml
    batch_inference_adapter_job_template_path: /etc/agentic-finetune-v2/batch-inference-adapter-job-template.yaml
    batch_inference_endpoint_job_template_path: /etc/agentic-finetune-v2/batch-inference-endpoint-job-template.yaml

    defaults:
      base_model: {{ .Values.orchestrator.defaults.baseModel | quote }}
      lora_rank: {{ .Values.orchestrator.defaults.loraRank }}
      max_steps: {{ .Values.orchestrator.defaults.maxSteps }}
      learning_rate: {{ .Values.orchestrator.defaults.learningRate }}
      cutoff_len: {{ .Values.orchestrator.defaults.cutoffLen }}
      per_device_train_batch_size: {{ .Values.orchestrator.defaults.perDeviceTrainBatchSize }}
      gradient_accumulation_steps: {{ .Values.orchestrator.defaults.gradientAccumulationSteps }}
      eval_steps: {{ .Values.orchestrator.defaults.evalSteps }}
      per_device_eval_batch_size: {{ .Values.orchestrator.defaults.perDeviceEvalBatchSize }}

    job_template:
      namespace: {{ .Release.Namespace | quote }}
      service_account: {{ include "agentic-finetune-v2.serviceAccountName" . | quote }}
      pvc_name: {{ include "agentic-finetune-v2.workspacePvcName" . | quote }}
