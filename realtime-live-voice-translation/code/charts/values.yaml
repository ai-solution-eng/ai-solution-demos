env:
  # DATABASE_URL is auto-constructed from postgresql.* when postgresql.enabled=true.
  # Uncomment and set manually to use an external database instead:
  # DATABASE_URL: "postgresql+asyncpg://realtime_voice_user:realtime_voice_password@postgresql.postgresql.svc.cluster.local:5432/realtime_voice_db"
  SESSION_STORAGE_ROOT: /data/realtime-sessions
  SESSION_TTL_HOURS: "12"
  # ============================================================
  # ASR model configuration for transcription
  # ============================================================
  ASR_BASE_URL: MLIS_MODEL_ENDPOINT/v1
  ASR_API_KEY: MLIS_MODEL_API_KEY
  ASR_MODEL: openai/whisper-large-v3-turbo
  # ============================================================
  # LLM model configuration for translation
  # ============================================================
  LLM_BASE_URL: MLIS_MODEL_ENDPOINT/v1
  LLM_API_KEY: MLIS_MODEL_API_KEY
  LLM_MODEL: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  # ============================================================
  # TTS model configuration for attendee text-to-speech
  # ============================================================
  TTS_BASE_URL: MLIS_MODEL_ENDPOINT/v1
  TTS_API_KEY: MLIS_MODEL_API_KEY
  TTS_MODEL: fishaudio/s2-pro
  TTS_VOICE: alys
  # ============================================================
  # ASR hallucination filter patterns (comma-separated)
  # ============================================================
  HALLUCINATION_PATTERNS: "you,thank you,thanks,продолжение следует"

persistence:
  enabled: true
  storageClass: gl4f-filesystem
  accessMode: ReadWriteMany
  size: 100Gi
  mountPath: /data/realtime-sessions
  existingClaim: ""
  annotations: {}

# PostgreSQL is auto-provisioned when enabled.
# Set enabled: false and provide env.DATABASE_URL to use an external database.
postgresql:
  enabled: true
  image: postgres:16-alpine
  storageClass: ""
  size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  auth:
    postgresPassword: "realtime_voice_password"
    database: realtime_voice_db
    username: realtime_voice_user
    password: "realtime_voice_password"

# ============================================================
# Application image
# ============================================================
images:
  backend:
    repository: "fcaliva/realtime-voice-translation"
    pullPolicy: "IfNotPresent"
    tag: "0.6.0"

  frontend:
    repository: "fcaliva/realtime-voice-translation-fe"
    pullPolicy: "IfNotPresent"
    tag: "0.6.0"

resources:
  backend:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "12Gi"

  frontend:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"

service:
  backendPort: 8000
  frontendPort: 80

# ============================================================
# EZUA settings
# ============================================================
ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "realtime-voice-translator.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"

certificatesPolicy:
  enabled: false

  env: []

  initVolumeMounts: []

  volumeMounts: []

  volumes: []
