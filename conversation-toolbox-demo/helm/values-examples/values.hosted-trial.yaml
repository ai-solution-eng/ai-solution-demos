# Conversation Toolbox — hosted-trial (customer PCAI) values (paste-ready, secret-free)
#
# Target: a customer-managed PCAI (HPE Private Cloud AI / Ezmeral Unified Analytics).
# PCAI resolves ${DOMAIN_NAME} before rendering — leave the ${DOMAIN_NAME}
# placeholders below exactly as they are.
#
# FULL VALUES — complete copy of helm/values.yaml with site edits marked '# SITE:'.
# Paste this whole document into the PCAI "Helm Values" editor, adjust every
# '# SITE:' line, replace every <UPPER_SNAKE> placeholder, and apply.
# SECRET-FREE by policy: real credentials live only in helm/local/values.<site>.yaml
# (gitignored, hardlink-ignored, never packaged).
#
# Cluster notes for hosted trials:
# - The chart ships a Kyverno ClusterPolicy ("add-vendor-app-labels-<release>-...")
#   as a pre-install hook (adds hpe-ezua vendor labels to Pods/Deployments/Services).
#   It is cluster-scoped: applying it needs ClusterPolicy permissions on the target
#   PCAI — get one-time platform-admin approval if the namespace is not privileged.
# - The oauth2-proxy AuthorizationPolicy is created in the istio-system namespace
#   (ezua.authorizationPolicy.namespace below) and needs write access there.
#
# Companion files: values.g2.yaml (HPE SE G2), README.md (usage).

# -- Deployment -----------------------------------------------------------------
deployment:
  name: conversation-toolbox
  appName: conversation-toolbox
  replicaCount: 1

# -- Image -------------------------------------------------------------------------
image:
  # SITE: default is Docker Hub; switch to the registry the customer cluster
  # can actually pull from (mirror/proxy e.g. ghcr.io/ai-solution-eng/...).
  repository: andrewbydlon/conversation-toolbox
  tag: v4.5.2
  pullPolicy: IfNotPresent

# -- Service exposure ------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# -- Resources ---------------------------------------------------------------------------
resources:
  requests:
    cpu: '2'
    memory: 2Gi
  limits:
    cpu: '4'
    memory: 4Gi

# -- Probes ----------------------------------------------------------------------------------
livenessProbe:
  enabled: true
  path: /health
  port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  path: /ready
  port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -- Environment --------------------------------------------------------------------------------
env:
- name: REDIS_URL
  value: redis://conversation-toolbox-redis:6379/0
- name: BATCH_TRANSCRIPTION_WORKER_COUNT
  value: '4'
- name: BATCH_MAX_CONCURRENT_JOBS
  value: '3'
- name: BATCH_MAX_MEMORY_PERCENT
  value: '75'
- name: BATCH_USE_BOUNDED_QUEUE
  value: 'true'

# -- Redis (batch job state) ------------------------------------------------------------------------
# Batch transcription stores job state + segment metadata here; segment
# audio is NOT in Redis (lives on PVC).
redis:
  external: false
  url: redis://conversation-toolbox-redis:6379/0
  # maxmemory controls when Redis starts rejecting writes. Must be below
  # the container memory limit. Use integer MB (Redis doesn't accept
  # fractional GB).
  maxmemory: '1536mb'
  maxmemoryPolicy: noeviction
  resources:
    requests:
      cpu: '250m'
      memory: 512Mi
    limits:
      cpu: '500m'
      memory: 2Gi

# -- ARQ batch-transcription workers -------------------------------------------------------------------
workers:
  enabled: true
  # When autoscaling is enabled, the HPA owns the replica count at runtime;
  # this value is only the initial deploy count before HPA takes over. Set
  # to match minReplicas to avoid brief over-provisioning on fresh deploys.
  replicaCount: 1
  resources:
    requests:
      cpu: '250m'
      memory: 1Gi
    limits:
      cpu: '500m'
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    memoryTarget: 70
    # KEDA on arq:queue depth is the better metric (actual backlog); requires
    # KEDA on the cluster. If you enable it, set `enabled: false` above so
    # KEDA and HPA don't fight over the same Deployment.
    keda:
      enabled: false

# -- Diarization (optional GPU service) --------------------------------------------------------------------
diarization:
  # SITE: enable only when the trial needs ML speaker diarization — it claims
  # a GPU; keep disabled to save GPUs. Requires the -diarization image
  # (<repository>:<tag>-diarization) and an HF token with access to the
  # pyannote pipelines.
  enabled: false
  baseUrl: http://conversation-toolbox-diarization:8001
  pipeline: pyannote/speaker-diarization-community-1
  gpuMemoryFraction: '0.10'
  # Optional: leave empty to let Kubernetes schedule on any node/GPU.
  cudaVisibleDevices: ""
  # SITE: set a GPU node name only if the trial cluster requires pinning.
  nodeName: ""
  tolerations: []
  resources:
    requests:
      cpu: '2'
      memory: 4Gi
    limits:
      cpu: '4'
      memory: 8Gi
  livenessProbe:
    enabled: true
    path: /health
    port: 8001
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /ready
    port: 8001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# -- Voice agent configuration (non-secret; wired via ConfigMap) ------------------------------------------------
config:
  # SITE: ASR vLLM endpoint (Cohere transcription) — e.g. a model service on
  # the customer PCAI: https://<asr-model-service>.${DOMAIN_NAME}
  # NO /v1 suffix. The model name is auto-discovered via /v1/models.
  asrBaseUrl: ""
  hallucinationPatterns: "thank you,thanks,\u043F\u0440\u043E\u0434\u043E\u043B\u0436\
    \u0435\u043D\u0438\u0435 \u0441\u043B\u0435\u0434\u0443\u0435\u0442"
  # SITE: LLM vLLM endpoint (Gemma) — NO /v1 suffix.
  llmBaseUrl: ""
  systemPrompt: You are a concise voice agent. Use tags with emotional descriptors like [laughing], [emphasis], [sad], [sigh], [shouting], or [short pause] to change the mood of your voice. This is not an exhaustive list of tags; there are 15k+. Don&#39;t use bold, italics, ..., or other strange syntax which may confuse the tts model. Use tools only if necessary.
  # SITE: TTS vLLM endpoint (Fish S2-pro / vLLM-Omni) — NO /v1 suffix.
  ttsBaseUrl: ""
  ttsVoice: alys
  sampleRate: '16000'
  vadAggression: '2'
  batchTranscriptionWorkerCount: '8'

# -- Model API keys (sensitive; rendered into a Secret) ------------------------------------------------------------
secrets:
  # SITE: fill real keys only in helm/local/values.<site>.yaml — never here.
  asrApiKey: <ASR_API_KEY>
  llmApiKey: <LLM_API_KEY>
  ttsApiKey: <TTS_API_KEY>
  # Required only when diarization.enabled=true; must own access to the
  # pyannote/speaker-diarization-community-1 and pyannote/segmentation-3.0 repos.
  hfToken: <HF_TOKEN>

# Preferred alternative on customer sites: create the Secret out-of-band so
# credentials never pass through a values document at all (then leave the
# secrets.* keys above as-is/empty):
#
# credentialsSecret:
#   create: false
#   name: conversation-toolbox-credentials

# -- Persistence (RWX project storage) ---------------------------------------------------------------------------------
persistence:
  recordings_dir:
    enabled: true
    # SITE: customer PCAI storage class — must be a ReadWriteMany (RWX)
    # filesystem class; replace the G2 default.
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
    size: 40Gi
    mountPath: /mnt/persistent/recordings/
    existingClaim: ''
    annotations: {}
  transcripts_dir:
    enabled: true
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
    size: 20Gi
    mountPath: /mnt/persistent/transcripts/
    existingClaim: ''
    annotations: {}
  hf_cache_dir:
    enabled: true
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
    size: 10Gi
    mountPath: /mnt/persistent/hf-cache
    existingClaim: ''
    annotations: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration ---------------------------------------------------------------------
ezua:
  enabled: true
  # SITE: keep ${DOMAIN_NAME} — PCAI substitutes the customer's domain.
  domainName: ${DOMAIN_NAME}   # informational only — no template reads it
  virtualService:
    # SITE: keep ${DOMAIN_NAME} (PCAI resolves it); adjust only the host prefix
    # if "conversation-toolbox" is taken on the customer's gateway.
    endpoint: conversation-toolbox.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 660s
  authorizationPolicy:
    # PCAI SSO: oauth2-proxy CUSTOM policy is created in istio-system; the
    # customer cluster must have the oauth2-proxy provider registered.
    namespace: istio-system
    providerName: oauth2-proxy
