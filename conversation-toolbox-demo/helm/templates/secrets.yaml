apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deployment.name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ASR_API_KEY: {{ .Values.secrets.asrApiKey | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  TTS_API_KEY: {{ .Values.secrets.ttsApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
