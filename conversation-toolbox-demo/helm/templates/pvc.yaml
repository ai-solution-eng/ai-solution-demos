{{- if and .Values.persistence.recordings_dir.enabled (not .Values.persistence.recordings_dir.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.deployment.name }}-recordings-pvc
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- with .Values.persistence.recordings_dir.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.recordings_dir.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.recordings_dir.size }}
  {{- if .Values.persistence.recordings_dir.storageClass }}
  storageClassName: {{ .Values.persistence.recordings_dir.storageClass }}
  {{- end }}
{{- end }}
