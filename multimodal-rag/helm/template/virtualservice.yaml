{{- if .Values.ezua.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.deployment.name }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    hpe-ezua/app: {{ .Chart.Name }}
    hpe-ezua/type: vendor-service
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    # Batch upload / SSE streams — long timeout for large ingests
    - match:
        - uri:
            regex: "/api/datasets/.*/batch-(files|urls)"
      route:
        - destination:
            host: {{ .Values.deployment.name }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.api.port }}
      timeout: {{ .Values.ezua.virtualService.longTimeout }}
    # MCP streamable-http — long timeout for reranked searches
    - match:
        - uri:
            prefix: /mcp
      route:
        - destination:
            host: {{ .Values.deployment.name }}-mcp.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.mcp.port }}
      timeout: {{ .Values.ezua.virtualService.longTimeout }}
    # All other API routes — short timeout
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.deployment.name }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.api.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
{{- end }}
