apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.deployment.name }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-qdrant
spec:
  serviceName: {{ .Values.deployment.name }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-qdrant
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}-qdrant
    spec:
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.qdrant.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.qdrant.httpPort }}
              name: http
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources: {{ toYaml .Values.resources.qdrant | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.qdrant.accessMode }}]
        {{- if .Values.persistence.qdrant.storageClass }}
        storageClassName: {{ .Values.persistence.qdrant.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.qdrant.size }}
