apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      # EzUA app-catalog labels on the POD TEMPLATE: the catalog derives a
      # card's status from labeled pods — an app whose pods carry no
      # hpe-ezua labels shows "Unknown" in the catalog (this chart was the
      # only unlabeled-pod app on G2 and the only Unknown card, 2026-10).
      # Long-running controllers only: cron-job pods stay UNLABELED — the
      # platform's assign-custom-scheduler-for-ezua-user-vendor-pods policy
      # stamps schedulerName on labeled pods at EVERY admission, and pod
      # updates (Job finalizer removal) then reject the immutable-field
      # change — the G2 2026-09-24 undeletable-cron-pod incident (see
      # tests/full_pipeline/test_kyverno_vendor_labels_render.py).
      labels:
        app: {{ .Values.deployment.appName }}
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-pvc-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          # Skip the walk when ownership is already correct: the data PVC
          # can hold hundreds of thousands of files (NFS), and chown -R
          # over NFS on every pod start stalls the rollout in Init for
          # many minutes per replica.
          command: ["sh", "-c", "if [ -n \"$(find /data ! -user 1000 -print 2>/dev/null | head -n 1)\" ]; then echo 'Fixing /data ownership...'; chown -R 1000:1000 /data; else echo 'Ownership already correct; skipping chown'; fi"]
          volumeMounts:
            - name: data
              mountPath: /data
      automountServiceAccountToken: false
      containers:
        - name: rag-api-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python
            - -m
            - multimodal_rag.api_server
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --data-path
            - "/data"
            - --qdrant-host
            - {{ .Values.deployment.name }}-qdrant
            - --qdrant-port
            - "6333"
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
            {{- if .Values.modelSecrets.existingSecret }}
            # User-owned model Secret (modelSecrets.existingSecret) — wired
            # LAST: every key it carries overrides the chart-managed Secret
            # and the ConfigMap (K8s merges later envFrom sources over
            # earlier ones); keys it omits fall back to the seeded/stored
            # values.  Missing Secret = CreateContainerConfigError (loud).
            - secretRef:
                name: {{ .Values.modelSecrets.existingSecret }}
            {{- end }}
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            - name: QDRANT_STORAGE_PATH
              {{- if .Values.persistence.qdrant.mountReadOnly }}
              value: "/qdrant-storage"
              {{- else }}
              value: ""
              {{- end }}
            - name: QDRANT_PVC_SIZE
              value: {{ .Values.persistence.qdrant.size | quote }}
            # Bound sync Qdrant calls so a hung Qdrant cannot pin a
            # sync_pool/qdrant-io thread (and the requests behind it) forever.
            - name: QDRANT_CLIENT_TIMEOUT
              value: "30"
            - name: CONFIG_DIR
              # The user-owned model Secret dir goes LAST: the watcher
              # (model_config.apply_config_dirs) merges dirs in order, later
              # over earlier — same precedence as envFrom above.
              value: "/etc/rag/config:/etc/rag/secrets{{ if .Values.modelSecrets.existingSecret }}:/etc/rag/model-keys-user{{ end }}"
            {{- if .Values.security.metricsAuth }}
            # Gate the /metrics exposition behind an API key (scrapers must
            # present X-RAG-Api-Key / X-API-Key / Bearer from the MCP key
            # set). Off (default) = public in-cluster exposition, unchanged.
            - name: RAG_METRICS_AUTH
              value: "true"
            {{- end }}
            {{- if .Values.security.existingSecret }}
            # REST API key + media-token secret: provided by a Secret YOU own
            # (security.existingSecret) — overrides the chart-managed Secret.
            - name: RAG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret }}
                  key: {{ .Values.security.existingSecretApiKey }}
            - name: MEDIA_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret }}
                  key: {{ .Values.security.existingSecretMediaTokenKey }}
            {{- end }}
            {{- if .Values.security.oidc.enabled }}
            # D21 (opt-in) OIDC JWT as a second credential for the same
            # per-user registry identity — rendered ONLY when enabled
            # (default render byte-identical). The registry serves BOTH
            # containers (REST + MCP must resolve the same identities).
            # ENABLED WITHOUT AN ISSUER still renders RAG_OIDC_ENABLED (the
            # app logs a loud startup warning and fails closed) — the env is
            # never silently dropped.
            - name: RAG_OIDC_ENABLED
              value: "true"
            - name: RAG_OIDC_ISSUER
              value: {{ .Values.security.oidc.issuer | quote }}
            - name: RAG_OIDC_AUDIENCE
              value: {{ .Values.security.oidc.audience | quote }}
            - name: RAG_OIDC_IDENTITY_CLAIM
              value: {{ .Values.security.oidc.identityClaim | quote }}
            {{- if .Values.security.oidc.jwksUrl }}
            - name: RAG_OIDC_JWKS_URL
              value: {{ .Values.security.oidc.jwksUrl | quote }}
            {{- end }}
            - name: RAG_OIDC_JWKS_REFRESH_SECONDS
              value: {{ .Values.security.oidc.jwksRefreshSeconds | quote }}
            - name: RAG_OIDC_OBSERVED_TTL
              value: {{ .Values.security.oidc.observedTtl | quote }}
            - name: RAG_OIDC_FETCH_TIMEOUT_SECONDS
              value: {{ .Values.security.oidc.fetchTimeoutSeconds | quote }}
            - name: RAG_OIDC_CLOCK_SKEW_SECONDS
              value: {{ .Values.security.oidc.clockSkewSeconds | quote }}
            {{- end }}
            {{- if .Values.security.oidc.sso.enabled }}
            # D22 browser SSO (the OWUI pattern): /oauth/* flow + the session
            # cookie envelope.  Rendered ONLY when sso.enabled — the default
            # render is byte-identical.  clientSecret prefers the existing
            # Secret; an inline value is back-compat.
            - name: RAG_OIDC_SSO_ENABLED
              value: "true"
            - name: RAG_OIDC_SSO_CLIENT_ID
              value: {{ .Values.security.oidc.sso.clientId | quote }}
            {{- if .Values.security.oidc.sso.clientExistingSecret }}
            - name: RAG_OIDC_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.oidc.sso.clientExistingSecret }}
                  key: {{ .Values.security.oidc.sso.clientExistingSecretKey }}
            {{- else }}
            - name: RAG_OIDC_SSO_CLIENT_SECRET
              value: {{ .Values.security.oidc.sso.clientSecret | quote }}
            {{- end }}
            {{- if .Values.security.oidc.sso.redirectUri }}
            - name: RAG_OIDC_SSO_REDIRECT_URI
              value: {{ .Values.security.oidc.sso.redirectUri | quote }}
            {{- end }}
            {{- if .Values.security.oidc.sso.providerUrl }}
            - name: RAG_OIDC_SSO_PROVIDER_URL
              value: {{ .Values.security.oidc.sso.providerUrl | quote }}
            {{- end }}
            - name: RAG_OIDC_SSO_SCOPES
              value: {{ .Values.security.oidc.sso.scopes | quote }}
            - name: RAG_OIDC_SSO_COOKIE_NAME
              value: {{ .Values.security.oidc.sso.cookieName | quote }}
            - name: RAG_OIDC_SSO_COOKIE_MAX_AGE
              value: {{ .Values.security.oidc.sso.cookieMaxAgeSeconds | quote }}
            - name: RAG_OIDC_SSO_COOKIE_SECURE
              value: {{ .Values.security.oidc.sso.cookieSecure | quote }}
            {{- end }}
            {{- if .Values.security.ssoGate }}
            # D23 identity gate on the served HTML pages (/, /manage, /access
            # require an authenticated identity; anonymous visitors get the
            # minimal 401 sign-in page).  Rendered ONLY when ssoGate — the
            # default render is byte-identical.  Read per request: flipping
            # the value needs no restart.  Empty deployments gate to nothing
            # (enable ONLY with oidc.enabled or API keys configured).
            - name: RAG_SSO_GATE
              value: "true"
            {{- end }}
            {{- if or .Values.mcp.apiKeyClients .Values.mcp.datasetAcls }}
            # D15 (opt-in) multi-user API keys + dataset ACLs — rendered ONLY
            # when set (default render byte-identical). The registry serves
            # BOTH containers (REST + MCP must resolve the same identities).
            # Values are key material: provide them from a Secret pipeline
            # (--set-string), never commit real keys to values files.
            {{- if .Values.mcp.apiKeyClients }}
            - name: RAG_API_KEY_CLIENTS
              value: {{ .Values.mcp.apiKeyClients | quote }}
            {{- end }}
            {{- if .Values.mcp.datasetAcls }}
            - name: RAG_DATASET_ACLS
              value: {{ .Values.mcp.datasetAcls | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rag-config
              mountPath: /etc/rag/config
              readOnly: true
            - name: rag-model-keys
              mountPath: /etc/rag/secrets
              readOnly: true
            {{- if .Values.modelSecrets.existingSecret }}
            - name: rag-model-keys-user
              mountPath: /etc/rag/model-keys-user
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: gunicorn-ctl
              mountPath: /home/app/.gunicorn
            {{- /* Qdrant's PVC, mounted read-only so the API server can report */}}
            {{- /* its disk usage on the management page. Disabled in the scale */}}
            {{- /* chart where Qdrant runs as a sharded cluster (no single PVC). */}}
            {{- if .Values.persistence.qdrant.mountReadOnly }}
            - name: qdrant-data
              mountPath: /qdrant-storage
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources.app | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        {{- if .Values.mcp.enabled }}
        - name: rag-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python
            - -m
            - multimodal_rag.mcp_server
          args:
            - --transport
            - streamable-http
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.mcp.port | quote }}
            - --data-path
            - "/data"
            - --qdrant-host
            - {{ .Values.deployment.name }}-qdrant
            - --qdrant-port
            - "6333"
          envFrom:
            - configMapRef:
                name: {{ .Values.deployment.name }}-config
            - secretRef:
                name: {{ .Values.deployment.name }}-model-keys
            {{- if .Values.modelSecrets.existingSecret }}
            # User-owned model Secret (modelSecrets.existingSecret) — wired
            # LAST: every key it carries overrides the chart-managed Secret
            # and the ConfigMap (K8s merges later envFrom sources over
            # earlier ones); keys it omits fall back to the seeded/stored
            # values.  Missing Secret = CreateContainerConfigError (loud).
            - secretRef:
                name: {{ .Values.modelSecrets.existingSecret }}
            {{- end }}
          env:
            - name: RAG_REMOTE
              value: {{ .Values.rag.remote | quote }}
            - name: CONFIG_DIR
              # The user-owned model Secret dir goes LAST: the watcher
              # (model_config.apply_config_dirs) merges dirs in order, later
              # over earlier — same precedence as envFrom above.
              value: "/etc/rag/config:/etc/rag/secrets{{ if .Values.modelSecrets.existingSecret }}:/etc/rag/model-keys-user{{ end }}"
            {{- if .Values.mcp.apiKey.existingSecret }}
            # OPTIONAL MCP API-key auth (fleet decision 2026-09): wired ONLY
            # when the values point at a Secret; unset → the MCP server runs
            # open with a loud startup warning (gateway-fronted deployments).
            - name: RAG_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.apiKey.existingSecret }}
                  key: {{ .Values.mcp.apiKey.existingSecretKey }}
            {{- end }}
            {{- if .Values.security.existingSecret }}
            # REST API key + media-token secret: provided by a Secret YOU own
            # (security.existingSecret) — overrides the chart-managed Secret.
            - name: RAG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret }}
                  key: {{ .Values.security.existingSecretApiKey }}
            - name: MEDIA_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret }}
                  key: {{ .Values.security.existingSecretMediaTokenKey }}
            {{- end }}
            {{- if .Values.security.oidc.enabled }}
            # D21 (opt-in) OIDC JWT as a second credential for the same
            # per-user registry identity — rendered ONLY when enabled
            # (default render byte-identical). The registry serves BOTH
            # containers (REST + MCP must resolve the same identities).
            # ENABLED WITHOUT AN ISSUER still renders RAG_OIDC_ENABLED (the
            # app logs a loud startup warning and fails closed) — the env is
            # never silently dropped.
            - name: RAG_OIDC_ENABLED
              value: "true"
            - name: RAG_OIDC_ISSUER
              value: {{ .Values.security.oidc.issuer | quote }}
            - name: RAG_OIDC_AUDIENCE
              value: {{ .Values.security.oidc.audience | quote }}
            - name: RAG_OIDC_IDENTITY_CLAIM
              value: {{ .Values.security.oidc.identityClaim | quote }}
            {{- if .Values.security.oidc.jwksUrl }}
            - name: RAG_OIDC_JWKS_URL
              value: {{ .Values.security.oidc.jwksUrl | quote }}
            {{- end }}
            - name: RAG_OIDC_JWKS_REFRESH_SECONDS
              value: {{ .Values.security.oidc.jwksRefreshSeconds | quote }}
            - name: RAG_OIDC_OBSERVED_TTL
              value: {{ .Values.security.oidc.observedTtl | quote }}
            - name: RAG_OIDC_FETCH_TIMEOUT_SECONDS
              value: {{ .Values.security.oidc.fetchTimeoutSeconds | quote }}
            - name: RAG_OIDC_CLOCK_SKEW_SECONDS
              value: {{ .Values.security.oidc.clockSkewSeconds | quote }}
            {{- end }}
            {{- if .Values.security.oidc.sso.enabled }}
            # D22 browser SSO (the OWUI pattern): /oauth/* flow + the session
            # cookie envelope.  Rendered ONLY when sso.enabled — the default
            # render is byte-identical.  clientSecret prefers the existing
            # Secret; an inline value is back-compat.
            - name: RAG_OIDC_SSO_ENABLED
              value: "true"
            - name: RAG_OIDC_SSO_CLIENT_ID
              value: {{ .Values.security.oidc.sso.clientId | quote }}
            {{- if .Values.security.oidc.sso.clientExistingSecret }}
            - name: RAG_OIDC_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.oidc.sso.clientExistingSecret }}
                  key: {{ .Values.security.oidc.sso.clientExistingSecretKey }}
            {{- else }}
            - name: RAG_OIDC_SSO_CLIENT_SECRET
              value: {{ .Values.security.oidc.sso.clientSecret | quote }}
            {{- end }}
            {{- if .Values.security.oidc.sso.redirectUri }}
            - name: RAG_OIDC_SSO_REDIRECT_URI
              value: {{ .Values.security.oidc.sso.redirectUri | quote }}
            {{- end }}
            {{- if .Values.security.oidc.sso.providerUrl }}
            - name: RAG_OIDC_SSO_PROVIDER_URL
              value: {{ .Values.security.oidc.sso.providerUrl | quote }}
            {{- end }}
            - name: RAG_OIDC_SSO_SCOPES
              value: {{ .Values.security.oidc.sso.scopes | quote }}
            - name: RAG_OIDC_SSO_COOKIE_NAME
              value: {{ .Values.security.oidc.sso.cookieName | quote }}
            - name: RAG_OIDC_SSO_COOKIE_MAX_AGE
              value: {{ .Values.security.oidc.sso.cookieMaxAgeSeconds | quote }}
            - name: RAG_OIDC_SSO_COOKIE_SECURE
              value: {{ .Values.security.oidc.sso.cookieSecure | quote }}
            {{- end }}
            {{- if .Values.security.ssoGate }}
            # D23 identity gate on the served HTML pages (/, /manage, /access
            # require an authenticated identity; anonymous visitors get the
            # minimal 401 sign-in page).  Rendered ONLY when ssoGate — the
            # default render is byte-identical.  Read per request: flipping
            # the value needs no restart.  Empty deployments gate to nothing
            # (enable ONLY with oidc.enabled or API keys configured).
            - name: RAG_SSO_GATE
              value: "true"
            {{- end }}
            {{- if or .Values.mcp.apiKeyClients .Values.mcp.datasetAcls }}
            # D15 (opt-in) multi-user API keys + dataset ACLs — rendered ONLY
            # when set (default render byte-identical). The registry serves
            # BOTH containers (REST + MCP must resolve the same identities).
            # Values are key material: provide them from a Secret pipeline
            # (--set-string), never commit real keys to values files.
            {{- if .Values.mcp.apiKeyClients }}
            - name: RAG_API_KEY_CLIENTS
              value: {{ .Values.mcp.apiKeyClients | quote }}
            {{- end }}
            {{- if .Values.mcp.datasetAcls }}
            - name: RAG_DATASET_ACLS
              value: {{ .Values.mcp.datasetAcls | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.mcp.port }}
              name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rag-config
              mountPath: /etc/rag/config
              readOnly: true
            - name: rag-model-keys
              mountPath: /etc/rag/secrets
              readOnly: true
            {{- if .Values.modelSecrets.existingSecret }}
            - name: rag-model-keys-user
              mountPath: /etc/rag/model-keys-user
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.qdrant.mountReadOnly }}
            - name: qdrant-data
              mountPath: /qdrant-storage
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources.app | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.port }}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
        {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.deployment.name }}-data
        - name: rag-config
          configMap:
            name: {{ .Values.deployment.name }}-config
        - name: rag-model-keys
          secret:
            secretName: {{ .Values.deployment.name }}-model-keys
        {{- if .Values.modelSecrets.existingSecret }}
        # User-owned model Secret (see envFrom note) — mounted so the
        # CONFIG_DIR watcher hot-reloads its keys too (<=15s, no rollout).
        - name: rag-model-keys-user
          secret:
            secretName: {{ .Values.modelSecrets.existingSecret }}
        {{- end }}
        {{- if .Values.persistence.qdrant.mountReadOnly }}
        {{- /* The Qdrant PVC is created by the qdrant StatefulSet's */}}
        {{- /* volumeClaimTemplates as data-<sts-name>-0. */}}
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: data-{{ .Values.deployment.name }}-qdrant-0
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: gunicorn-ctl
          emptyDir: {}
