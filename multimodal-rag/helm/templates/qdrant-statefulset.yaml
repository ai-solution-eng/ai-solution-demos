apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.deployment.name }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-qdrant
spec:
  serviceName: {{ .Values.deployment.name }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}-qdrant
  template:
    metadata:
      # EzUA app-catalog labels on the POD TEMPLATE: the catalog derives a
      # card's status from labeled pods — an app whose pods carry no
      # hpe-ezua labels shows "Unknown" in the catalog (this chart was the
      # only unlabeled-pod app on G2 and the only Unknown card, 2026-10).
      # Long-running controllers only: cron-job pods stay UNLABELED — the
      # platform's assign-custom-scheduler-for-ezua-user-vendor-pods policy
      # stamps schedulerName on labeled pods at EVERY admission, and pod
      # updates (Job finalizer removal) then reject the immutable-field
      # change — the G2 2026-09-24 undeletable-cron-pod incident (see
      # tests/full_pipeline/test_kyverno_vendor_labels_render.py).
      labels:
        app: {{ .Values.deployment.name }}-qdrant
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}{{ if .Values.qdrant.image.digest }}@{{ .Values.qdrant.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          env:
            {{- if .Values.qdrant.telemetryDisabled }}
            # Qdrant phones home to telemetry.qdrant.io hourly; on clusters
            # without open internet egress that fails ~24x/day per node and
            # drowns the ERROR signal (721 entries in 9 days on SE-G2 —
            # found by logsearch-mcp's first cross-namespace sweep).
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            # P3-8 (2026-11-10 audit): every other container in every chart
            # runs readOnlyRootFilesystem; qdrant was the outlier.  Its writes
            # go to /qdrant/storage (the PVC); /tmp gets an emptyDir for any
            # scratch the binary needs.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.qdrant.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.qdrant.httpPort }}
              name: http
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
            - name: snapshots
              # B1 (wave-2 review): qdrant writes snapshots to SNAPSHOTS_PATH
              # (default /qdrant/snapshots).  Under the P3-8 read-only root
              # filesystem the directory must exist writable or snapshot
              # creation fails (and can fail at startup).  emptyDir keeps
              # snapshots volatile by design — they are export artifacts, not
              # durable state; point this at a real PVC if you keep them.
              mountPath: /qdrant/snapshots
            - name: tmp
              mountPath: /tmp
          resources: {{ toYaml .Values.resources.qdrant | nindent 12 }}
          # startupProbe first: a large-collection cold start (recovery replay)
          # can far exceed 30s — without it the liveness probe kills the pod
          # mid-replay and the STS crash-loops (audit 2026-10-16). Same shape
          # as the scale charts.
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            # A cold join replays the whole raft log over NFS; the old 30x5s
            # (150s) budget killed the pod mid-catch-up (2026-10-17 incident).
            # Generous by default because the safe wait is data-dependent.
            failureThreshold: {{ .Values.qdrant.startupProbeFailureThreshold | default 240 }}
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.qdrant.httpPort }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.qdrant.httpPort }}
            initialDelaySeconds: 0
            periodSeconds: 10
      volumes:
        # P3-8 (2026-11-10 audit): scratch for the readOnlyRootFilesystem
        # qdrant container (the real writes go to the data volumeClaimTemplate).
        - name: tmp
          emptyDir: {}
        # B1 (wave-2 review): writable snapshots dir (SNAPSHOTS_PATH default).
        - name: snapshots
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.qdrant.accessMode }}]
        {{- if .Values.persistence.qdrant.storageClass }}
        storageClassName: {{ .Values.persistence.qdrant.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.qdrant.size }}
