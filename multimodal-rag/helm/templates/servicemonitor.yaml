{{- if .Values.metrics.serviceMonitor }}
# Prometheus Operator ServiceMonitor scraping the API container's /metrics.
# With security.metricsAuth on, set metrics.serviceMonitorBearerSecret (+
# …SecretKey) so the scraper presents the API key as its bearer token.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.interval | quote }}
      {{- if .Values.metrics.serviceMonitorBearerSecret }}
      bearerTokenSecret:
        name: {{ .Values.metrics.serviceMonitorBearerSecret }}
        key: {{ .Values.metrics.serviceMonitorBearerSecretKey }}
      {{- end }}
{{- end }}
