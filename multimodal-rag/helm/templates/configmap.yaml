apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployment.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
data:
  # NAME entries are optional: empty → auto-discovered via /v1/models.
  # Embedder
  MODEL_EMBEDDER_NAME: {{ .Values.models.embedder.name | quote }}
  MODEL_EMBEDDER_URL: {{ .Values.models.embedder.url | quote }}
  MODEL_EMBEDDER_CLASS: {{ .Values.models.embedder.className | quote }}
  MODEL_EMBEDDER_EXTRA: {{ .Values.models.embedder.extra | toJson | quote }}
  # Reranker
  MODEL_RERANKER_NAME: {{ .Values.models.reranker.name | quote }}
  MODEL_RERANKER_URL: {{ .Values.models.reranker.url | quote }}
  MODEL_RERANKER_CLASS: {{ .Values.models.reranker.className | quote }}
  MODEL_RERANKER_EXTRA: {{ .Values.models.reranker.extra | toJson | quote }}
  # VLM
  MODEL_VLM_NAME: {{ .Values.models.vlm.name | quote }}
  MODEL_VLM_URL: {{ .Values.models.vlm.url | quote }}
  MODEL_VLM_EXTRA: {{ .Values.models.vlm.extra | toJson | quote }}
  # ASR
  MODEL_ASR_NAME: {{ .Values.models.asr.name | quote }}
  MODEL_ASR_URL: {{ .Values.models.asr.url | quote }}
  MODEL_ASR_EXTRA: {{ .Values.models.asr.extra | toJson | quote }}
  # RAG pipeline
  RAG_OCR_DEFAULT: {{ .Values.rag.ocr | default false | quote }}
  {{- if .Values.rag.contextual }}
  # Contextual-retrieval create default — rendered ONLY when enabled, so the
  # default render stays byte-identical to the pre-feature chart (the
  # gated-feature rule; a disabled deployment must not gain a config key).
  RAG_CONTEXTUAL_DEFAULT: "true"
  {{- end }}
  RAG_CAPTION_WITH_ASR: {{ .Values.rag.captionWithAsr | quote }}
  RAG_CAPTION_WITH_VLM: {{ .Values.rag.captionWithVlm | quote }}
  RAG_REMOTE: {{ .Values.rag.remote | quote }}
  RAG_DEDUP_THRESHOLD: {{ .Values.rag.dedupThreshold | quote }}
  {{- $unlockMaxTtl := 86400 }}
  {{- if hasKey .Values.rag "unlockMaxTtl" }}{{- $unlockMaxTtl = int .Values.rag.unlockMaxTtl }}{{- end }}
  RAG_UNLOCK_MAX_TTL: {{ $unlockMaxTtl | quote }}
  {{- $rrf := .Values.rag.rrfDefault | default dict }}
  {{- if and $rrf (dig "enabled" false $rrf) }}
  # Weighted-RRF per-dataset create-time default — rendered ONLY when
  # enabled, so the default render is byte-identical to the pre-feature
  # chart (gated-feature rule).  Format: "dense,sparse[,k]".
  RAG_RRF_DEFAULT: "{{ $rrf.dense | default 1.0 }},{{ $rrf.sparse | default 1.0 }}{{- if $rrf.k }},{{ $rrf.k }}{{- end }}"
  {{- end }}
  # Media base URL (for PVC-to-HTTP conversion in MCP search results)
  MEDIA_BASE_URL: {{ printf "https://%s" .Values.ezua.virtualService.endpoint | quote }}
  # S3 / MinIO endpoint (not sensitive — just a URL).  Optional: leave
  # empty to use the default boto3 credential chain (IAM, ~/.aws/…).
  S3_ENDPOINT_URL: {{ (.Values.s3.endpointUrl) | default "" | quote }}

  # -- Security hardening (opt-in; see .Values.security) ----------------------
  INGEST_ALLOW_HOSTS: {{ .Values.security.ingestAllowHosts | default "" | quote }}
  INGEST_BLOCK_PRIVATE_HOSTS: {{ .Values.security.blockPrivateHosts | default false | quote }}
  MAX_REMOTE_DOWNLOAD_BYTES: {{ int (.Values.security.maxDownloadBytes | default 536870912) | quote }}
  ARCHIVE_MAX_TOTAL_BYTES: {{ int (.Values.security.archiveMaxTotalBytes | default 2147483648) | quote }}
  ARCHIVE_MAX_MEMBER_BYTES: {{ int (.Values.security.archiveMaxMemberBytes | default 1073741824) | quote }}
  ARCHIVE_MAX_ENTRIES: {{ int (.Values.security.archiveMaxEntries | default 10000) | quote }}
  MEDIA_ALLOW_PATH_PREFIXES: {{ .Values.security.mediaAllowPathPrefixes | default "" | quote }}
  MEDIA_TOKEN_TTL: {{ int (.Values.security.mediaTokenTtl | default 3600) | quote }}
  PW_MAX_FAILURES: {{ int (.Values.security.pwMaxFailures | default 10) | quote }}
  PW_FAIL_WINDOW: {{ int (.Values.security.pwFailWindow | default 300) | quote }}
  RAG_TRUST_PROXY_IDENTITY: {{ .Values.security.trustProxyIdentity | default false | quote }}
  # D16 self-service dataset selection (the /access checkbox model) —
  # ALWAYS rendered (the default is true, ratified 2026-09-24): with the
  # store on, registry-key users select their own datasets (protected ones
  # with the password, saved per identity under /data/access); effective
  # access = operator ACL ∪ selections.  Explicit false opts out.
  RAG_ACCESS_STORE: {{ .Values.security.accessStore | default false | quote }}
  {{- if .Values.security.accessDenySelect }}
  RAG_ACCESS_DENY_SELECT: {{ .Values.security.accessDenySelect | quote }}
  {{- end }}
  {{- if .Values.security.accessSelfMint }}
  # D25 SSO self-mint (chart default ON — set security.accessSelfMint to
  # false to omit): SSO-authenticated identities (JWT / SSO cookie /
  # trusted proxy headers) may mint their OWN long-lived API key from the
  # Access page.  Read per request — flip without a restart.
  RAG_ACCESS_SELF_MINT: "true"
  {{- end }}
  {{- if .Values.security.memoryDefault }}
  # Deployment-wide fallback memory dataset (used when a caller has no
  # personal ★ binding and no client headers/env).
  RAG_MEMORY_DEFAULT: {{ .Values.security.memoryDefault | quote }}
  {{- end }}
