{{- if .Values.backups.enabled }}
# Opt-in scheduled dataset backups: exports every dataset via
# GET /api/datasets/{name}/export and uploads the .tar.gz to the configured
# S3/MinIO bucket (reuses the app image's httpx + boto3 and the existing S3_*
# credentials from the model-keys Secret).  Password-protected datasets are
# exported too WHEN their password is available in the optional
# protected-passwords Secret (backups.protectedPasswords.existingSecret —
# one key per dataset name, value = the dataset password, mounted read-only
# at /etc/rag/dataset-passwords; a volume mount rather than envFrom because
# dataset names carry hyphens/dots that envFrom would silently drop).
# A protected dataset WITHOUT a matching key is skipped with a loud
# SKIP-PROTECTED log line naming the missing key — never silently.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.deployment.name }}-backups
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  schedule: {{ .Values.backups.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Keep the finished Job (and its failed pod) around long enough to
      # read the logs: the TTL controller deletes the Job cascadingly
      # (pods included) after this many seconds.  failedJobsHistoryLimit
      # above is what evicts the JOB after 3 later ticks; this bounds the
      # pod lifetime WITHIN that window so a failing tick is debuggable.
      # (Same contract watched-sources ships.)
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          # Deliberately NO hpe-ezua vendor labels on cron pods: the platform's
          # scheduler-stamping vendor policy makes labeled pods undeletable on
          # pod update (immutable schedulerName; G2 2026-09-24 incident). The
          # app-catalog status comes from the long-running pods — see the
          # pod-template comment in templates/deployment.yaml.
          labels:
            app: {{ .Values.deployment.appName }}
        spec:
          automountServiceAccountToken: false
          # ── qdrant readiness gate (2026-10-17 incident; P2-8 2026-11-10) ──
          # A cron tick must NOT touch qdrant while the cluster is still
          # forming: after a cold STS restart a node can answer 503 for
          # minutes, and a read that lands on an orphaned shard panics the
          # leader (min > max).  Wait for /readyz, bounded by
          # cronQdrantReadyTimeoutSeconds (default 1800 = 30 min); on
          # timeout this tick FAILS loudly (the next tick retries) rather
          # than hammering a half-joined cluster.  (Copied from the
          # watched-sources cron, which got the gate first.)
          initContainers:
            - name: wait-for-qdrant
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - python
                - -c
                - |
                  import sys, time, urllib.request
                  url = "http://{{ .Values.deployment.name }}-qdrant:{{ .Values.qdrant.httpPort }}/readyz"
                  budget = int("{{ .Values.cronQdrantReadyTimeoutSeconds | default 1800 }}")
                  deadline = time.time() + budget
                  while True:
                      try:
                          with urllib.request.urlopen(url, timeout=5) as r:
                              if r.status == 200:
                                  print("qdrant /readyz OK"); sys.exit(0)
                      except Exception:
                          pass
                      if time.time() >= deadline:
                          print("qdrant not ready after " + str(budget) + "s - failing this tick (next tick retries)"); sys.exit(1)
                      time.sleep(10)
          # Never (not OnFailure): with OnFailure the job controller DELETES
          # the pod the moment backoffLimit is reached - the failed tick's
          # output was unreachable (2026-09 pcai-se, the same loss
          # watched-sources fixed).  With Never the failed pod stays in
          # place as a terminated pod owned by the (TTL-retained) Job, so
          # kubectl logs <pod> still works after the failure.  The export is
          # idempotent (dataset/<stamp>.tar.gz keys never overwrite), so a
          # fresh pod on retry costs nothing.
          restartPolicy: Never
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - python
                - -c
                - |
                  import os, datetime, tempfile, boto3, httpx

                  # The deployment REST key from the model-keys Secret (envFrom
                  # below) — without this header every call 401s under
                  # security.apiKey (the long-standing backup-cron gap, fixed
                  # 2026-09 alongside the watched-sources cron).
                  api_key = os.environ.get("RAG_API_KEY") or ""
                  headers = {"X-RAG-Api-Key": api_key} if api_key else {}
                  if not headers:
                      print("[backup] WARNING: RAG_API_KEY empty - auth-enabled deployments will 401 every call")
                  api = os.environ["BACKUP_API_URL"].rstrip("/")
                  PW_DIR = "/etc/rag/dataset-passwords"
                  bucket = os.environ["BACKUP_BUCKET"]
                  endpoint = os.environ.get("S3_ENDPOINT_URL") or None
                  s3 = boto3.client(
                      "s3",
                      endpoint_url=endpoint,
                      aws_access_key_id=os.environ.get("S3_ACCESS_KEY_ID") or None,
                      aws_secret_access_key=os.environ.get("S3_SECRET_ACCESS_KEY") or None,
                  )
                  stamp = datetime.datetime.now(datetime.UTC).strftime("%Y%m%d-%H%M%S")
                  resp = httpx.get(f"{api}/api/datasets", headers=headers or None, timeout=30.0)
                  resp.raise_for_status()
                  datasets = resp.json().get("datasets", [])
                  exported = skipped = failed = 0
                  for ds in datasets:
                      name = ds.get("name", "")
                      if not name:
                          continue
                      pw = None
                      if ds.get("has_password"):
                          pw_file = os.path.join(PW_DIR, name)
                          try:
                              with open(pw_file, "r", encoding="utf-8") as pf:
                                  pw = pf.read().rstrip("\r\n") or None
                          except OSError:
                              pw = None
                          if not pw:
                              print(f"[backup] SKIP-PROTECTED {name}: no key '{name}' in the protected-passwords Secret - add it to enable this dataset's backup")
                              skipped += 1
                              continue
                      try:
                          with tempfile.NamedTemporaryFile(suffix=".tar.gz") as f:
                              export_headers = dict(headers)
                              if pw:
                                  export_headers["X-Dataset-Password"] = pw
                              with httpx.stream("GET", f"{api}/api/datasets/{name}/export", headers=export_headers or None, timeout=httpx.Timeout(1800.0, connect=30.0)) as r:
                                  r.raise_for_status()
                                  for chunk in r.iter_bytes():
                                      f.write(chunk)
                              f.flush()
                              key = f"{name}/{stamp}.tar.gz"
                              s3.upload_file(f.name, bucket, key)
                          print(f"[backup] {name} -> s3://{bucket}/{key}")
                          exported += 1
                      except Exception as exc:
                          print(f"[backup] FAILED {name}: {exc}")
                          failed += 1
                  retention = int(os.environ.get("BACKUP_RETENTION_DAYS") or "0")
                  if retention > 0:
                      try:
                          cutoff = datetime.datetime.now(datetime.UTC) - datetime.timedelta(days=retention)
                          pruned = 0
                          prefixes, token = [], None
                          while True:
                              kw = {"Bucket": bucket, "Delimiter": "/"}
                              if token:
                                  kw["ContinuationToken"] = token
                              r = s3.list_objects_v2(**kw)
                              prefixes += [p["Prefix"] for p in r.get("CommonPrefixes", [])]
                              if not r.get("IsTruncated"):
                                  break
                              token = r.get("NextContinuationToken")
                          for pfx in prefixes:
                              token = None
                              while True:
                                  kw = {"Bucket": bucket, "Prefix": pfx}
                                  if token:
                                      kw["ContinuationToken"] = token
                                  r = s3.list_objects_v2(**kw)
                                  stale = [{"Key": o["Key"]} for o in r.get("Contents", []) if o["LastModified"] < cutoff]
                                  while stale:
                                      s3.delete_objects(Bucket=bucket, Delete={"Objects": stale[:1000], "Quiet": True})
                                      pruned += len(stale[:1000])
                                      stale = stale[1000:]
                                  if not r.get("IsTruncated"):
                                      break
                                  token = r.get("NextContinuationToken")
                          print(f"[backup] retention: pruned {pruned} object(s) older than {retention}d")
                      except Exception as exc:
                          print(f"[backup] retention prune failed (non-fatal): {exc}")
                  print(f"[backup] done: {exported} exported, {skipped} skipped (protected), {failed} failed")
                  # P2-9 (2026-11-10 audit): ANY failed dataset fails the tick -
                  # a 3/10 backup must not report Job Succeeded.  The next tick
                  # retries every dataset; exports are idempotent
                  # (dataset/<stamp>.tar.gz keys never overwrite).
                  raise SystemExit(1 if failed else 0)
              envFrom:
                - configMapRef:
                    name: {{ .Values.deployment.name }}-config
                - secretRef:
                    name: {{ .Values.deployment.name }}-model-keys
                {{- if .Values.modelSecrets.existingSecret }}
                # User-owned model Secret — S3_*/REDIS_PASSWORD (and any model
                # keys) it carries override the chart-managed Secret here too;
                # keys it omits keep the seeded/stored values.
                - secretRef:
                    name: {{ .Values.modelSecrets.existingSecret }}
                {{- end }}
              env:
                - name: BACKUP_API_URL
                  value: "http://{{ .Values.deployment.name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.api.port }}"
                - name: BACKUP_BUCKET
                  value: {{ .Values.backups.bucket | quote }}
                - name: BACKUP_RETENTION_DAYS
                  value: {{ .Values.backups.retentionDays | default 0 | quote }}
                {{- if .Values.security.existingSecret }}
                # REST API key + media-token secret come from the user-owned
                # Secret (security.existingSecret) — the chart-managed
                # -model-keys Secret renders neither key in that mode, so
                # envFrom alone would leave RAG_API_KEY empty (401 on every
                # backup tick).
                - name: RAG_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.security.existingSecret }}
                      key: {{ .Values.security.existingSecretApiKey }}
                - name: MEDIA_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.security.existingSecret }}
                      key: {{ .Values.security.existingSecretMediaTokenKey }}
                {{- end }}
                {{- range $key, $val := .Values.extraEnv }}
                - name: {{ $key }}
                  value: {{ $val | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- if .Values.backups.protectedPasswords.existingSecret }}
                - name: dataset-passwords
                  mountPath: /etc/rag/dataset-passwords
                  readOnly: true
                {{- end }}
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
          volumes:
            - name: tmp
              emptyDir: {}
            {{- if .Values.backups.protectedPasswords.existingSecret }}
            - name: dataset-passwords
              secret:
                secretName: {{ .Values.backups.protectedPasswords.existingSecret }}
            {{- end }}
{{- end }}
