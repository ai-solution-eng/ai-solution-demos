{{- /*
  REST API key (RAG_API_KEY) + media-token HMAC secret (MEDIA_TOKEN_SECRET)
  sourcing — highest precedence first:
    1. security.existingSecret: a Secret YOU own provides both keys
       (security.existingSecretApiKey / existingSecretMediaTokenKey); this
       chart's Secret renders neither key, and the deployment wires both env
       vars from your Secret via secretKeyRef.
    2. security.apiKey / security.mediaTokenSecret set inline: used verbatim
       (back-compat with pre-2026-09 values files).
    3. lookup of this chart's own Secret: on `helm upgrade` the values from
       the previous install are REUSED, so upgrading never rotates a secret
       underneath the running deployment.
    4. nothing found: fresh values are generated on first install (32-char
       API key; 64-hex media-token secret).
  The chart repository ships no key material (P0-7, 2026-09). The values
  are private; rotation is OPTIONAL — read helm/ROTATION.md first.
*/ -}}
{{- $secName := printf "%s-model-keys" .Values.deployment.name -}}
{{- $useExisting := false -}}
{{- if .Values.security.existingSecret -}}
{{-   $useExisting = true -}}
{{- end -}}
{{- $apiKey := "" -}}
{{- $mediaTokenSecret := "" -}}
{{- if not $useExisting -}}
{{-   $existing := lookup "v1" "Secret" .Release.Namespace $secName -}}
{{-   $prevApi := "" -}}
{{-   $prevTok := "" -}}
{{-   if $existing -}}
{{-     $prevApi = get ($existing.data | default dict) "RAG_API_KEY" | default "" | b64dec -}}
{{-     $prevTok = get ($existing.data | default dict) "MEDIA_TOKEN_SECRET" | default "" | b64dec -}}
{{-   end -}}
{{-   $apiKey = .Values.security.apiKey | default $prevApi | default (randAlphaNum 32) -}}
{{-   $mediaTokenSecret = .Values.security.mediaTokenSecret | default $prevTok | default (randAlphaNum 32 | sha256sum) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
type: Opaque
stringData:
  MODEL_EMBEDDER_API_KEY: {{ .Values.modelSecrets.embedderApiKey | quote }}
  MODEL_RERANKER_API_KEY: {{ .Values.modelSecrets.rerankerApiKey | quote }}
  MODEL_VLM_API_KEY: {{ .Values.modelSecrets.vlmApiKey | quote }}
  MODEL_ASR_API_KEY: {{ .Values.modelSecrets.asrApiKey | quote }}
  # S3 / MinIO access credentials (optional — leave empty to use the
  # default boto3 credential chain).
  S3_ACCESS_KEY_ID: {{ (.Values.s3.accessKeyId) | default "" | quote }}
  S3_SECRET_ACCESS_KEY: {{ (.Values.s3.secretAccessKey) | default "" | quote }}
  {{- if not $useExisting }}
  # REST API-key auth + shared media-token HMAC secret — never shipped in
  # the chart: inline back-compat value, reuse of the previously released
  # value, or first-install generation (see header; helm/ROTATION.md).
  RAG_API_KEY: {{ $apiKey | quote }}
  MEDIA_TOKEN_SECRET: {{ $mediaTokenSecret | quote }}
  {{- end }}
  # Redis unlock-cache auth (scale charts; empty = unauthenticated).
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}


