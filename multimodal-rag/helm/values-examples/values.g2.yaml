# =============================================================================
# Multimodal RAG — SE G2 deployment values (sanitized) — single-replica chart.
#
# Variant: helm/  (chart rag-mcp-server, 1 API replica + MCP sidecar, 1 Qdrant)
# Choose this variant for pilots and single-team use — smallest footprint.
# For concurrent multi-user throughput use helm-scale-medium/ or
# helm-scale-large/ instead (more API replicas + sharded Qdrant).
#
# Sanitized SE-G2 deployment: real (non-secret) serving URLs and the real
# cluster domain are kept; ALL credentials are fillers. This folder is
# hardlinked to the public delivery repo — never put real credentials here.
# Real per-site values live in helm/local/ (gitignored + hardlink-ignored +
# never packaged).
#
# PCAI usage: import the packaged chart once, paste this whole file into the
# release's Helm Values editor, adjust the '# SITE:' lines, apply.
# Operators with cluster access may render-check first:
#   helm template <release> helm/ -f helm/values-examples/values.g2.yaml
# =============================================================================

# -- Deployment -----------------------------------------------------------------
replicaCount: 1

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v3.6.3
  pullPolicy: IfNotPresent

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

# -- Persistence ------------------------------------------------------------------
persistence:
  data:
    # SITE: size to the corpus (RWX storage class required)
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
  qdrant:
    # SITE: size to the corpus
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
    mountReadOnly: true

# -- Model configuration -------------------------------------------------------------
# The embedder is the only required endpoint; leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    # SITE: SE-G2 shared serving endpoints (public URLs, not secret)
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Same-embedder alias for the dataset fingerprint guard: datasets indexed
      # under this id keep working after the FP8 swap (vectors agree to >=0.95 cosine).
      # Requires an image with alias support — v4.0.0 rejects unknown extra keys.
      alias: Qwen/Qwen3-VL-Embedding-8B
  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # SITE: optional — precision at the cost of latency
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    className: MultiModalReranker
    extra: {}
  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # SITE: optional — captions images/videos, converts them at query time
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    extra: {}
  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # SITE: optional — transcribes audio + video soundtracks
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    extra: {}

# -- Model API keys (sensitive — fillers here) -----------------------------------------
# Rendered into the <name>-model-keys Secret (env MODEL_*_API_KEY).
# SE G2: platform JWTs for the serving endpoints — kept ONLY in helm/local/.
modelSecrets:
  # SITE: paste the real platform JWT for each endpoint you enabled
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# -- S3 / MinIO ---------------------------------------------------------------------------
# Endpoint URL is non-sensitive (ConfigMap); access keys go into the Secret.
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  # SITE: fill only if the site's MinIO needs static keys (else leave "" for
  # the default boto3 credential chain)
  accessKeyId: ""
  secretAccessKey: ""

# -- RAG parameters ---------------------------------------------------------------------------
rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # Keep false on SE G2: URLs containing ".serving." are rewritten to their
  # in-cluster .svc.cluster.local form.
  remote: false
  dedupThreshold: 0.995

# -- Qdrant --------------------------------------------------------------------------------------
# Single-replica chart: Qdrant runs as one StatefulSet; the API mounts its
# PVC read-only (mountReadOnly above) to report disk usage.
qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.19.0
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  telemetryDisabled: true

# -- MCP server (sidecar) --------------------------------------------------------------------------
mcp:
  apiKey:
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"

  enabled: true
  port: 9090

# -- Service configuration -----------------------------------------------------------------------------
service:
  api:
    type: ClusterIP
    port: 80
  mcp:
    type: ClusterIP

# -- Resources ---------------------------------------------------------------------------------------------
# SITE: tune to the namespace quota
resources:
  app:
    requests:
      memory: 2Gi
      cpu: 2
    limits:
      memory: 8Gi
      cpu: 4
  qdrant:
    requests:
      memory: 16Gi
      cpu: '4'
    limits:
      memory: 32Gi
      cpu: '8'

extraEnv: {}

# -- Security hardening ------------------------------------------------------------------------------------------
# mediaTokenSecret is REQUIRED: both the API and MCP containers refuse to
# start without it. Generate: python -c "import secrets; print(secrets.token_hex(32))"
security:
  # SITE: the chart ships NO key material (hidden 2026-09, P0-7). Replace
  # both fillers, leave '' to let the chart auto-generate per install, or
  # point security.existingSecret at a Secret you manage. Rotation is
  # OPTIONAL and operator-initiated — read helm/ROTATION.md first.
  apiKey: "<RAG_API_KEY>"
  mediaTokenSecret: "<MEDIA_TOKEN_SECRET>"
  # Optional: Secret you manage providing both keys (key names in
  # existingSecretApiKey / existingSecretMediaTokenKey).
  existingSecret: ''
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # true is correct on SE G2 / hosted trials: an enforcing auth proxy
  # (oauth2-proxy) overwrites the identity headers on every request.
  trustProxyIdentity: true

# -- Redis (unused by the single-replica chart; kept for template uniformity) ---------------------------------------
redis:
  enabled: false
  password: ''

# -- Metrics (optional) -----------------------------------------------------------------------------------------------
metrics:
  serviceMonitor: false
  interval: 30s

# -- Backups (optional) ---------------------------------------------------------------------------------------------------
backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0

# -- PCAI (HPE Ezmeral Unified Analytics) integration -----------------------------------------------------------------------
ezua:
  enabled: true
  virtualService:
    # SITE: SE-G2 cluster domain (literal — or use rag-mcp-server.${DOMAIN_NAME})
    endpoint: rag-mcp-server.pcai-se-ai-application.hst.rdlabs.hpecorp.net
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s
  authorizationPolicy:
    # SITE: false on SE G2 — the ezaf-gateway applies HPE SSO centrally, so the
    # chart does not create its own AuthorizationPolicy. Set true (+ provider
    # oauth2-proxy) on customer PCAI clusters.
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
