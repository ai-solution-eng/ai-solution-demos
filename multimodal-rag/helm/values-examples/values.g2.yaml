# ============================================================================
# Multimodal RAG — SE G2 deployment values (sanitized) — helm/ chart, single
# replica (1 API replica + MCP sidecar, 1 Qdrant StatefulSet). Concurrent
# multi-user throughput: helm-scale-medium/ or helm-scale-large/.
# Sanitized: real (non-secret) serving URLs + cluster domain; ALL credentials
# are fillers — this folder is hardlinked to the public repo, never add real ones.
# Full guide: documentation/DEPLOYMENT.md.
# PCAI usage: paste this whole file into the release's Helm Values editor, apply.
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = CreateContainerError; every key the Secret carries
# overrides the values seeds below it).
#   1. modelSecrets.existingSecret — the broad secret: MODEL_*_API_KEY per enabled
#      role (+ optional MODEL_*_URL / S3_* / REDIS_PASSWORD)
#   2. models.embedder.url — reachable embedder endpoint (startup ABORTS if unreachable)
#   3. security.existingSecret — RAG_API_KEY + MEDIA_TOKEN_SECRET
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled

# ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   SSO / identity stack: security.oidc.* / oidc.sso.* / ssoGate / trustProxyIdentity — DEPLOYMENT.md §5b
#   Multi-user keys + access store: mcp.apiKeyClients / mcp.datasetAcls / security.accessStore — §2
#   Storage: s3.* / backups.* / watchedSources.* (each source REQUIRES dataset + >=1 prefix) — §2 + §7b
#   Metrics: metrics.serviceMonitor (+ bearer Secret when security.metricsAuth) — §2

# ============================================================================
# Image / Deployment
# ============================================================================

deployment:
  name: rag-mcp-server
  appName: rag-mcp-server

replicaCount: 1

image:
  # Packaged with the chart — leave as-is unless you built your own image.
  repository: ghcr.io/ai-solution-eng/multimodal-rag-mcp
  tag: v6.3.2
  pullPolicy: IfNotPresent

# Single-replica chart: the API mounts the Qdrant PVC read-only for disk reporting.
qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.19.2
    pullPolicy: IfNotPresent
  grpcPort: 6334
  httpPort: 6333
  telemetryDisabled: true

redis:
  enabled: false
  password: ''

# ============================================================================
# Resources
# ============================================================================

resources:
  app:
    requests: {cpu: 2, memory: 2Gi}
    limits: {cpu: 4, memory: 8Gi}

  qdrant:
    requests: {cpu: '4', memory: 16Gi}
    limits: {cpu: '8', memory: 32Gi}

persistence:
  data:
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany

  qdrant:
    size: 50Gi
    storageClass: gl4f-filesystem
    accessMode: ReadWriteMany
    mountReadOnly: true

# ============================================================================
# Secrets
# ============================================================================

# The embedder is the only required endpoint; leave url "" to disable a role.
models:
  embedder:
    name: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    url: https://qwen3-vl-embedding-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalEmbeddings
    extra:
      embedding_dim: 4096
      chunk_size: 2048
      chunk_overlap: 256
      code_chunk_size: 8192
      code_chunk_overlap: 512
      tokenizer_name: Qwen/Qwen3-VL-Embedding-8B
      tokenizer_type: HuggingFace
      # Alias: datasets indexed under this id keep working after the FP8 swap.
      alias: Qwen/Qwen3-VL-Embedding-8B

  reranker:
    name: Qwen/Qwen3-VL-Reranker-8B
    # optional — precision at the cost of latency
    url: https://qwen3-vl-reranker-8b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    className: MultiModalReranker
    extra: {}

  vlm:
    name: Qwen/Qwen3.8-27B-FP8
    # optional — captions images/videos, converts them at query time
    url: https://qwen-38-27b.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

  asr:
    name: CohereLabs/cohere-transcribe-03-2026
    # optional — transcribes audio + video soundtracks
    url: https://cohere-transcribe-03-2026.project-user-andrew-bydlon.serving.${DOMAIN_NAME}
    extra: {}

# Rendered into the <name>-model-keys Secret (env MODEL_*_API_KEY); real keys live in helm/local/.
modelSecrets:
  # One Secret you own can carry MODEL_*_API_KEY (+ optional MODEL_*_URL, S3_*, REDIS_PASSWORD).
  existingSecret: ""
  embedderApiKey: "<EMBEDDER_API_KEY>"
  rerankerApiKey: "<RERANKER_API_KEY>"
  vlmApiKey: "<VLM_API_KEY>"
  asrApiKey: "<ASR_API_KEY>"

# ============================================================================
# App Defaults
# ============================================================================

rag:
  ocr: false
  captionWithAsr: true
  captionWithVlm: true
  # Keep false on SE G2: ".serving." URLs rewrite to in-cluster .svc.cluster.local.
  remote: false
  dedupThreshold: 0.995
  # Ingest-time contextual retrieval — OFF; the per-dataset checkbox is the recommended path.
  contextual: false

  # Weighted-RRF create-time defaults — DISABLED (per-dataset is the path).
  rrfDefault:
    enabled: false
    dense: 1.0
    sparse: 1.0
    k: 2

  # Caps explicit unlock TTLs; 0 = the /access "No expiry (0)" option becomes selectable.
  unlockMaxTtl: 0

mcp:
  apiKey:
    # Pre-create the Secret — the chart never creates or inlines this key:
    # kubectl -n <ns> create secret generic mcp-fleet-apikeys --from-literal='api-keys=<key1>,<key2>'
    existingSecret: "mcp-fleet-apikeys"
    existingSecretKey: "api-keys"
  # Per-user keys + dataset ACLs — key material; supply from a Secret pipeline, never commit.
  # Grant syntax "name:ds1:ro,ds2:rw": a bare token = rw, ":ro" refuses writes.
  apiKeyClients: ""
  datasetAcls: ""

  enabled: true
  port: 9090

extraEnv: {}

# ============================================================================
# Security
# ============================================================================

# mediaTokenSecret is REQUIRED: both the API and MCP containers refuse to start without it.
security:
  # kubectl -n <ns> create secret generic rag-platform-keys \
  # --from-literal=RAG_API_KEY='<deployment key>' \
  # --from-literal=MEDIA_TOKEN_SECRET='<64-hex secret>'
  existingSecret: "rag-platform-keys"
  existingSecretApiKey: RAG_API_KEY
  existingSecretMediaTokenKey: MEDIA_TOKEN_SECRET
  mediaTokenTtl: 3600
  ingestAllowHosts: ''
  blockPrivateHosts: true
  maxDownloadBytes: 536870912
  archiveMaxTotalBytes: 2147483648
  archiveMaxMemberBytes: 1073741824
  archiveMaxEntries: 10000
  mediaAllowPathPrefixes: /data/datasets:/data/staging
  pwMaxFailures: 10
  pwFailWindow: 300
  # Trust X-Auth-Request-*/X-Email/X-User headers. TRUE here BY CHOICE (chart
  # default is now false).  P3-9 (2026-11-10 audit): network position is NOT
  # the guarantee — the AuthorizationPolicy below selects only the
  # istio: ingressgateway pods, so a direct ClusterIP call never traverses
  # it; the actual protection is the D21 forwarded-token assertion
  # (fail-closed).  Never set it true without that; enable networkPolicy for
  # the full posture.
  trustProxyIdentity: true

  # Self-service dataset selection + ★ memory binding on /access — ON this site.
  # Per-user keys come from mcp.apiKeyClients or the page's own mint.
  accessStore: true
  # Comma-separated datasets that can never be self-selected (renders only when non-empty).
  accessDenySelect: ''
  accessSelfMint: true   # ezaf-gateway proxy identities mint/rotate their own key on the Access page
  # Fallback memory dataset (RAG_MEMORY_DEFAULT) for callers without a ★ binding.
  memoryDefault: ''
  # Empty: security.existingSecret above supplies both (inline = back-compat only).
  apiKey: ''
  mediaTokenSecret: ''
  # Gate /metrics behind an API key (false = public in-cluster exposition).
  metricsAuth: false
  oidc:
    enabled: true
    issuer: "https://keycloak.${DOMAIN_NAME}/realms/UA"
    audience: ua
    identityClaim: preferred_username
    # In-cluster Keycloak headless service (plain HTTP inside the mesh).
    jwksUrl: "http://keycloak-headless.keycloak.svc.cluster.local:8080/realms/UA/protocol/openid-connect/certs"
    jwksRefreshSeconds: 3600
    observedTtl: 86400
    fetchTimeoutSeconds: 3
    clockSkewSeconds: 60

    platformCa:
      configMapName: ezaf-root-ca
      configMapKey: ezaf-root-ca.crt

    sso:
      enabled: true
      clientId: ua
      # Substituted by the PCAI values editor at deploy time.
      clientSecret: "${OIDC_CLIENT_SECRET}"
      clientExistingSecret: ""
      clientExistingSecretKey: clientSecret
      redirectUri: "https://rag-mcp-server.${DOMAIN_NAME}/oauth/oidc/callback"
      providerUrl: "https://keycloak.${DOMAIN_NAME}/realms/UA/.well-known/openid-configuration"
      scopes: "openid profile email"
      cookieName: pcai-sso
      cookieMaxAgeSeconds: 43200
      cookieSecure: true
  ssoGate: false

metrics:
  serviceMonitor: false
  interval: 30s
  # With metricsAuth on: the Secret/key the ServiceMonitor presents as its scrape bearer token.
  serviceMonitorBearerSecret: ''
  serviceMonitorBearerSecretKey: RAG_API_KEY

# ============================================================================
# S3 Related
# ============================================================================

# Endpoint URL is non-sensitive (ConfigMap); access keys go into the Secret.
s3:
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  accessKeyId: ""
  secretAccessKey: ""

backups:
  enabled: false
  schedule: 0 3 * * *
  bucket: ''
  retentionDays: 0
  # Optional Secret (keys = dataset names, values = passwords) so
  # password-protected datasets are backed up too; '' = skip them.
  protectedPasswords:
    existingSecret: ''

# Opt-in reconciler CronJob: POSTs each source's s3:// prefixes to batch-urls
# (new/changed ingest, deleted prune); every prefix must be an s3:// directory.
watchedSources:
  enabled: false
  schedule: '*/15 * * * *'
  sources: []

# ============================================================================
# PCAI Networking
# ============================================================================

service:
  api:
    type: ClusterIP
    port: 80

  mcp:
    type: ClusterIP

ezua:
  enabled: true
  virtualService:
    endpoint: rag-mcp-server.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s
    longTimeout: 3600s

  authorizationPolicy:
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy
