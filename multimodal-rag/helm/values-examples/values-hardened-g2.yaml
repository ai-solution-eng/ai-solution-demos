# ============================================================================
# rag-mcp-server — HARDENED-G2 overlay: turns the MCP network zone ON (NOT standalone;
# merge onto values.g2.yaml). Unlisted callers time out — confirm the relay ns is listed.
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# ============================================================================

# ============================================================================
# PCAI Networking
# ============================================================================

# The VirtualService stays rendered (browser path unchanged); the Qdrant StatefulSet is NOT selected.
ezua:
  virtualService:
    enabled: true

networkPolicy:
  enabled: true
  sameNamespace: true
  authorizedClients:
    namespaces:
      - pcai-llm            # LLM Gateway relay (in-cluster MCP relay)
      - dsh-web-helm        # DSH web (live gateway allowlist)
      - owebui0-11-0        # OWUI instance on the live gateway allowlist
      - opencode-web-helm   # OpenCode web
      - prometheus         # the ACTUAL Prometheus scraper — NOT the `monitoring` ns;
                            # omit it and Prometheus up=0 within one scrape interval.
      - monitoring          # /metrics scraping (ServiceMonitor) — omit and it dies SILENTLY.
  # USER-FACING: the gateway rule stays ON — VS routes (/, /mcp, batch-upload) arrive via the edge.
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system

  ingressGatewayLabels:
    app: istio-ingressgateway   # live edge-pod label (NOT app=ezaf-gateway)
  # Kubelet probes originate at the NODE: allow node IPs only; pod traffic stays zone-governed.
  probeCidrs:
    - 172.28.1.61/32
    - 172.28.1.62/32
    - 172.28.1.63/32
    - 172.28.1.161/32
    - 172.28.1.162/32
  # Empty with per-node /32 allows: ipBlock.except must be a strict subset of the cidr.
  probeExceptCidrs: []
