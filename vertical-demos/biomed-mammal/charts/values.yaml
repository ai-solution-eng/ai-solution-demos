env:
  DEVICE: "cpu"
  HF_TOKEN: hf_TOKEN

# ============================================================
# Proxy configuration (for clusters behind corporate proxy)
# ============================================================
# Set proxy.enabled to true to enable proxy settings for the user container.
# The init container will also inherit these settings.
proxy:
  enabled: false
  env:
    - name: HTTP_PROXY
      value: ""
    - name: http_proxy
      value: ""
    - name: HTTPS_PROXY
      value: ""
    - name: https_proxy
      value: ""

no_proxy:
  enabled: true
  env:
    - name: NO_PROXY
      value: ""
    - name: no_proxy
      value: ""

# ============================================================
# Application images
# ============================================================
images:
  backend:
    repository: "fcaliva/biomed-mammal"
    pullPolicy: "IfNotPresent"
    tag: "latest"

  frontend:
    repository: "fcaliva/biomed-ui"
    pullPolicy: "IfNotPresent"
    tag: "latest"

# ============================================================
# Resource limits & requests
# ============================================================
resources:
  backend:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

  frontend:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"

# ============================================================
# Service ports
# ============================================================
service:
  backendPort: 3000
  backendTargetPort: 3000
  frontendPort: 8080
  frontendTargetPort: 8080
  # Override MODEL_URL for the frontend (e.g. "http://host.docker.internal:3000" for local testing).
  # If empty, auto-generates from the backend K8s service name.
  modelUrlOverride: ""

# ============================================================
# EZUA settings
# ============================================================
ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "biomed-mammal.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"

# ============================================================
# SSL certificates policy
# ============================================================
certificatesPolicy:
  enabled: false

  env:
    - name: SSL_CERT_DIR
      value: ""
    - name: REQUESTS_CA_BUNDLE
      value: /tmp/certs/ca-certificates.crt
    - name: SSL_CERT_FILE
      value: /tmp/certs/ca-certificates.crt
    - name: AIOHTTP_CLIENT_SESSION_SSL
      value: /tmp/certs/ca-certificates.crt
    - name: CURL_CA_BUNDLE
      value: /tmp/certs/ca-certificates.crt

  initVolumeMounts: []

  volumeMounts: []
  
  volumes: []
