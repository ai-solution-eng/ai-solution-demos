server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE: disable buffering so /api/runs/{id}/events streams in real time
    location ~ ^/api/.*events$ {
        proxy_pass http://engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API fallback (engine)
    location /api/ {
        proxy_pass http://engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # Health
    location = /healthz {
        proxy_pass http://engine:8080/healthz;
    }
}
