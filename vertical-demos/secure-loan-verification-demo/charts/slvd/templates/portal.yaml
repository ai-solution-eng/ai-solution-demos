apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "slvd.labels" . | nindent 4 }}
    app: portal
spec:
  replicas: 1
  selector:
    matchLabels: { app: portal }
  template:
    metadata:
      labels:
        {{- include "slvd.labels" . | nindent 8 }}
        {{- include "hpe-ezua.labels" . | nindent 8 }}
        app: portal
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: portal
          image: {{ .Values.global.imageRegistry }}/{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag }}
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.portal.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "slvd.labels" . | nindent 4 }}
    app: portal
spec:
  selector: { app: portal }
  ports: [{ name: http, port: 80, targetPort: 80 }]
