{{- if .Values.networkPolicy.enabled }}
# Only the Istio ingress gateway, which enforces SSO, may reach the services. The four
# containers talk to each other over localhost, which a NetworkPolicy does not affect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "defence-ops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defence-ops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "defence-ops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressGateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressGateway.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.appUi.port }}
        - port: {{ .Values.kafkaService.port }}
        - port: {{ .Values.llmService.port }}
        - port: {{ .Values.videoService.port }}
{{- end }}
