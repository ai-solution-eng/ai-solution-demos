{{- $host := printf "%s.%s.svc.cluster.local" (include "defence-ops.fullname" .) .Release.Namespace }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ printf "%s-%s-virtual-service" .Release.Name .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hpe-ezua.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required ".Values.ezua.virtualService.endpoint is required !\n" }}
  http:
    - match:
        - uri:
            prefix: "/api/v1/admin"
      route:
        - destination:
            host: {{ $host }}
            port:
              number: {{ .Values.appUi.port }}
    - match:
        - uri:
            prefix: "/api/v1/video"
      route:
        - destination:
            host: {{ $host }}
            port:
              number: {{ .Values.videoService.port }}
    - match:
        - uri:
            prefix: "/api/v1/llm"
      route:
        - destination:
            host: {{ $host }}
            port:
              number: {{ .Values.llmService.port }}
      timeout: 600s
    - match:
        - uri:
            prefix: "/api/v1/kafka"
      route:
        - destination:
            host: {{ $host }}
            port:
              number: {{ .Values.kafkaService.port }}
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: {{ $host }}
            port:
              number: {{ .Values.appUi.port }}
