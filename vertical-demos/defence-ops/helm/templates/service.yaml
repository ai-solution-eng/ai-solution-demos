apiVersion: v1
kind: Service
metadata:
  name: {{ include "defence-ops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defence-ops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "defence-ops.selectorLabels" . | nindent 4 }}
  ports:
    - name: ui
      port: {{ .Values.appUi.port }}
      targetPort: ui
    - name: kafka
      port: {{ .Values.kafkaService.port }}
      targetPort: kafka
    - name: llm
      port: {{ .Values.llmService.port }}
      targetPort: llm
    - name: video
      port: {{ .Values.videoService.port }}
      targetPort: video
