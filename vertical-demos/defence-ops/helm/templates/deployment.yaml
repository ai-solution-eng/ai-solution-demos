apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "defence-ops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defence-ops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # app-data is ReadWriteOnce and holds config.json: replace the pod rather than run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "defence-ops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "defence-ops.selectorLabels" . | nindent 8 }}
      annotations:
        # Restarts the pod when credentials given as values change.
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "defence-ops.serviceAccountName" . }}
      # Nothing in the pod calls the Kubernetes API.
      automountServiceAccountToken: false
      # No variables for every other Service in the namespace: the containers reach each other on
      # localhost, and nothing reads them.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Lets the app user write config.json on app-data
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-ui
          image: {{ include "defence-ops.image" (dict "root" . "service" .Values.appUi) | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: ui
              containerPort: {{ .Values.appUi.port }}
          env:
            {{- include "defence-ops.env" (dict "root" . "service" .Values.appUi) | nindent 12 }}
            - name: SETTINGS_AUTH
              value: {{ .Values.settings.auth | quote }}
            {{- if eq .Values.settings.auth "oidc" }}
            - name: ADMIN_ROLE
              value: {{ .Values.settings.adminRole | quote }}
            - name: OIDC_ISSUER
              value: {{ include "defence-ops.oidcIssuer" . | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.ezua.oidc.client_id | default "ua" | quote }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.settings.oidcJwksUrl | quote }}
            {{- end }}
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: NPM_CONFIG_UPDATE_NOTIFIER
              value: "false"
          {{- include "defence-ops.probes" .Values.appUi | nindent 10 }}
          {{- include "defence-ops.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.appUi.resources | nindent 12 }}
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
        - name: kafka-service
          image: {{ include "defence-ops.image" (dict "root" . "service" .Values.kafkaService) | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: kafka
              containerPort: {{ .Values.kafkaService.port }}
          env:
            {{- include "defence-ops.env" (dict "root" . "service" .Values.kafkaService) | nindent 12 }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.kafka.saslMechanism | quote }}
            {{- with include "defence-ops.kafkaSecretName" . }}
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
          {{- include "defence-ops.probes" .Values.kafkaService | nindent 10 }}
          {{- include "defence-ops.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.kafkaService.resources | nindent 12 }}
          volumeMounts:
            - name: app-data
              mountPath: /app/data
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: llm-service
          image: {{ include "defence-ops.image" (dict "root" . "service" .Values.llmService) | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: llm
              containerPort: {{ .Values.llmService.port }}
          env:
            {{- include "defence-ops.env" (dict "root" . "service" .Values.llmService) | nindent 12 }}
            - name: LITELLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            {{- with include "defence-ops.llmSecretName" . }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ include "defence-ops.llmSecretKey" $ }}
            {{- end }}
            - name: VIDEO_SERVICE_URL
              value: "http://127.0.0.1:{{ .Values.videoService.port }}"
            - name: MAX_IMAGES
              value: {{ .Values.llm.maxImages | quote }}
            {{- range $flag, $env := dict "vision" "LLM_SUPPORTS_VISION" "video" "LLM_SUPPORTS_VIDEO" "reasoning" "LLM_SUPPORTS_REASONING" }}
            {{- $raw := index $.Values.llm.capabilities $flag }}
            {{- $value := ternary "" (toString $raw) (kindIs "invalid" $raw) }}
            {{- if has $value (list "true" "false") }}
            - name: {{ $env }}
              value: {{ $value | quote }}
            {{- else if ne $value "" }}
            {{- fail (printf "llm.capabilities.%s must be true, false or empty, not %s" $flag $value) }}
            {{- end }}
            {{- end }}
          {{- include "defence-ops.probes" .Values.llmService | nindent 10 }}
          {{- include "defence-ops.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.llmService.resources | nindent 12 }}
          volumeMounts:
            - name: app-data
              mountPath: /app/data
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: video-service
          image: {{ include "defence-ops.image" (dict "root" . "service" .Values.videoService) | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: video
              containerPort: {{ .Values.videoService.port }}
          env:
            {{- include "defence-ops.env" (dict "root" . "service" .Values.videoService) | nindent 12 }}
            - name: UPLOAD_DIR
              value: /app/data/videos
            - name: MAX_UPLOAD_MB
              value: {{ .Values.videoService.maxUploadMB | quote }}
          {{- include "defence-ops.probes" .Values.videoService | nindent 10 }}
          {{- include "defence-ops.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.videoService.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/data/videos
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        # Scratch space for the read-only containers: temp files, Next.js's cache, uploads
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: uploads
          emptyDir:
            sizeLimit: {{ mul .Values.videoService.maxUploadMB 2 }}Mi
