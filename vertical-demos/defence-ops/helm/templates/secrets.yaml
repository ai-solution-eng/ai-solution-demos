{{- /*
Secrets made from credentials given as values. An existing Secret named in the values is used
instead, and then none is made here.
*/ -}}
{{- if and .Values.llm.apiKey (not .Values.llm.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "defence-ops.llmSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defence-ops.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.llm.apiKey | quote }}
{{- end }}
{{- if and (or .Values.kafka.username .Values.kafka.password) (not .Values.kafka.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "defence-ops.kafkaSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defence-ops.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.kafka.username | quote }}
  password: {{ .Values.kafka.password | quote }}
{{- end }}
