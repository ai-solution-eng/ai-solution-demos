[project]
name = "defence-ops-kafka-service"
version = "1.2.0"
description = "Streams tactical alerts from Kafka to the Ops Centre over Server-Sent Events."
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sse-starlette>=3.6.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", ".."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ".."

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
