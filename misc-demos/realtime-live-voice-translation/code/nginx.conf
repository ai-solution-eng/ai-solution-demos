server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML: never cached — deploys must be visible on the next reload.
  location ~* \.html$ {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # Hashed-asset-grade caching is not in use (plain filenames), so scripts
  # and styles are also revalidated: small files, freshness over bytes.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}